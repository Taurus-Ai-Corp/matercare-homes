[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eldcare-ai-platform"
version = "1.0.0"
description = "AI-powered eldercare platform with passive IoT monitoring, 6-phase care loop orchestration, and MCP integration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TAURUS AI Corp", email = "info@taurusai.io"}
]
keywords = ["eldercare", "ai", "healthcare", "iot", "sensor", "fall-detection", "rag", "llm", "care-loop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "huggingface-hub>=0.20.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
]
rag = [
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
all = [
    "eldcare-ai-platform[ml,rag,dev]",
]

[project.urls]
Homepage = "https://github.com/Taurus-AI-Corp/eldcare-ai-platform"
Documentation = "https://github.com/Taurus-AI-Corp/eldcare-ai-platform#readme"
Repository = "https://github.com/Taurus-AI-Corp/eldcare-ai-platform"
Issues = "https://github.com/Taurus-AI-Corp/eldcare-ai-platform/issues"

[project.scripts]
eldcare-cli = "eldcare_cli.main:main"
eldcare-api = "eldcare_cli.api_server:main"
eldcare-mcp = "eldcare_cli.mcp_server:main"
eldcare-orchestrator = "eldcare_cli.orchestrator:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["eldcare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
